services:
  backend:
    build:
      context: ./student-backend
      dockerfile: Dockerfile
    container_name: student-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./student-frontend
      dockerfile: Dockerfile
    container_name: student-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: student-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: student_db
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - student_db_data:/var/lib/mysql

volumes:
  student_db_data: